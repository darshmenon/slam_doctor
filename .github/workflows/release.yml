name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install pytest numpy opencv-python-headless && python -m pytest -q test
      - name: tag matches package version
        run: test "v$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package.xml)" = "${GITHUB_REF_NAME}"
      - run: git archive --prefix=slam_doctor/ -o "$RUNNER_TEMP/slam_doctor-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/slam_doctor-*.tar.gz
          body_path: CHANGELOG.md
